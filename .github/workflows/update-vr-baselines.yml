# Regenerates the visual-regression baselines in CI's rendering environment
# and opens a PR with the new images. Dispatch this manually after an
# intentional visual change (or once, to seed the first CI-authoritative
# baselines). See docs/visual-regression.md.
name: Update VR baselines
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:vr:update
      - name: Open a PR with the new baselines
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: e2e/__vr_baselines__
          branch: vr/update-baselines
          commit-message: "vr: update visual-regression baselines (CI render)"
          title: "Update visual-regression baselines"
          body: |
            Regenerated by the **Update VR baselines** workflow on `ubuntu-latest`.

            Review by eyeballing each changed PNG in the *Files changed* tab
            (GitHub renders an image diff — use the swipe/onion-skin views).
            Every change should correspond to an intentional visual change;
            anything unexpected is a regression this PR would bake in.
