name: CI
permissions:
  contents: read
on: [push]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - name: Check formatting
        run: npx prettier --check .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run lint
  check-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      # Tenancy + soft-delete query guard: every corpus statement must name its
      # tenant and say what it means about tombstones
      # (src/data/sql-tenancy-guard.ts).
      - run: npm run check:queries
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - name: Check for dead code
        run: npm run knip
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run test
  # test-storybook:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v3
  #     - uses: actions/setup-node@v3
  #       with:
  #         node-version: 22.x
  #         cache: "npm"
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run test:storybook:ci
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds its own storybook (no other job produces one) and compares
      # against e2e/__vr_baselines__. Skips cleanly if the baselines were
      # rendered on a different platform — see docs/visual-regression.md.
      - run: npm run test:vr
      - name: Upload screenshots (diffs on failure + always the refreshed set)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-output
          path: e2e/__vr_artifacts__/
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npm run build
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - run: npx vite-node scripts/benchmark.ts >> $GITHUB_STEP_SUMMARY
